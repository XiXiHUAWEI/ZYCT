<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智愈错题 - AI 错题诊断与个性化学习</title>

    <!-- =========================================================
         网站图标（浏览器标签页上那个小图标）
         ---------------------------------------------------------
         图案就是导航栏左上角那个学士帽 Logo，见 favicon.svg。
         末尾的 ?v=1 是"版本号"，用来强制浏览器重新下载 ——
         因为浏览器会把 favicon 缓存很久，不加它你换了图标也看不到。
         以后改了 favicon.svg，把 v=1 改成 v=2 就能立刻看到效果。
         ========================================================= -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">

    <!-- 手机浏览器地址栏的颜色，和网站主色保持一致 -->
    <meta name="theme-color" content="#2563EB">

    <!-- Bootstrap 5：只用来做基础复位和折叠面板的交互，外观基本被 style.css 接管 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- 我们自己的样式（界面全靠它） -->
    <link rel="stylesheet" href="css/style.css">

    <!-- =========================================================
         主题初始化：必须放在 <head> 里、样式表之后、页面渲染之前。
         否则刷新页面时会先显示浅色、再"啪"地跳成深色，很刺眼。
         这段代码只做一件事：把上次选的主题提前写到 <html> 上。
         ========================================================= -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem("zhixue-theme");
                if (saved === "dark" || saved === "light") {
                    document.documentElement.setAttribute("data-theme", saved);
                }
            } catch (error) {
                /* 有些浏览器隐私模式下不让用 localStorage，忽略即可 */
            }
        })();
    </script>
</head>
<body>

    <!-- =========================================================
         顶部导航栏
         ========================================================= -->
    <header class="app-navbar">
        <div class="navbar-inner">

            <!-- ============ 侧边栏收起 / 展开按钮 ============
                 放在最左边（左上角），收起后也能一眼看到。 -->
            <button
                id="sidebar-toggle-btn"
                class="nav-icon-btn"
                type="button"
                title="收起 / 展开会话侧边栏"
                aria-label="收起或展开侧边栏"
            >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="16" rx="2"/>
                    <path d="M9 4v16"/>
                </svg>
            </button>

            <!-- 品牌区：图标 + 名字 -->
            <div class="brand">
                <span class="brand-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 10 12 5 2 10l10 5 10-5Z"/>
                        <path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/>
                    </svg>
                </span>
                <span class="brand-name">智愈错题</span>
            </div>

            <!-- 副标题标签（灰底小胶囊） -->
            <span class="nav-tag d-none d-md-inline">AI 苏格拉底式多轮追问</span>

            <!-- 后端连接状态：由 app.js 动态修改文字和颜色 -->
            <span id="conn-badge" class="badge bg-secondary">检查中...</span>

            <!-- ============ 学习报告按钮 ============ -->
            <button
                id="report-btn"
                class="btn-nav-primary"
                type="button"
                title="查看学习报告（知识点与错因统计）"
            >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 3v18h18"/>
                    <rect x="7" y="12" width="3" height="6" rx="1"/>
                    <rect x="12" y="8" width="3" height="10" rx="1"/>
                    <rect x="17" y="5" width="3" height="13" rx="1"/>
                </svg>
                <span class="d-none d-lg-inline">学习报告</span>
            </button>

            <!-- ============ 深色模式切换按钮 ============
                 两个图标都放在按钮里，用 CSS 根据 data-theme 决定显示哪个。
                 这样 JS 只需要切换 <html> 上的属性，不用去改图标。 -->
            <button
                id="theme-toggle-btn"
                class="theme-toggle"
                type="button"
                title="切换深色 / 浅色模式"
                aria-label="切换深色模式"
            >
                <!-- 太阳：浅色模式下显示（点它会变深色） -->
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4"/>
                    <path d="M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>

                <!-- 月亮：深色模式下显示（点它会变浅色） -->
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
                </svg>
            </button>

        </div>
    </header>

    <!-- =========================================================
         AI 没配置好时的警告条
         ========================================================= -->
    <div id="ai-warning" class="alert alert-warning d-none app-alert" role="alert"></div>

    <!-- =========================================================
         主体：左会话栏（固定 250px） + 右聊天区（flex: 1）
         ========================================================= -->
    <div class="app-body">

        <!-- ==================== 左侧：会话侧边栏 ==================== -->
        <aside id="sidebar" class="sidebar">

            <div class="sidebar-header">

                <div class="new-session-row">

                    <label class="student-field" for="student-id" title="切换学生 ID">
                        <span class="student-label">学生</span>
                        <input type="number" id="student-id" value="1" min="1">
                    </label>

                    <button id="new-session-btn" class="btn-new-session" type="button">
                        <svg class="icon-plus" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                        <span>新建会话</span>
                    </button>

                    <!-- 批量管理：点一下进入/退出多选模式 -->
                    <button
                        id="batch-toggle-btn"
                        class="btn-icon-batch"
                        type="button"
                        title="批量管理会话"
                        aria-label="批量管理会话"
                    >
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="7" height="7" rx="1.5"/>
                            <path d="m3.5 16.5 2 2 4-4"/>
                            <path d="M14 7.5h6M14 17.5h6"/>
                        </svg>
                    </button>

                </div>

                <div class="sidebar-title">会话记录</div>

                <!-- 批量操作栏：只在批量管理模式下出现（平时是 d-none） -->
                <div id="batch-bar" class="batch-bar d-none">
                    <div id="batch-count" class="batch-count">已选 0 个</div>

                    <div class="batch-actions">
                        <button id="batch-select-all" class="btn-mini" type="button">全选</button>
                        <button id="batch-clear" class="btn-mini" type="button">取消全选</button>
                        <button id="batch-delete" class="btn-mini btn-mini-danger" type="button">
                            删除选中
                        </button>
                    </div>
                </div>

            </div>

            <!-- 会话列表：内容由 app.js 动态生成（含"置顶/今天/昨天"分组标题） -->
            <div id="session-list" class="session-list">
                <div class="session-empty">加载中...</div>
            </div>

        </aside>

        <!-- ==================== 右侧：聊天区 ==================== -->
        <section class="chat-area">

            <!-- ① 标题栏（固定） -->
            <header class="chat-header">

                <div class="chat-header-text">
                    <div id="chat-title" class="chat-title">未选择会话</div>
                    <div id="chat-meta" class="chat-meta">&nbsp;</div>
                </div>

                <button
                    id="log-toggle-btn"
                    class="btn-ghost"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#log-panel"
                >
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m8 6-6 6 6 6"/>
                        <path d="m16 6 6 6-6 6"/>
                    </svg>
                    <span>日志</span>
                </button>

            </header>

            <!-- =========================================================
                 ② 消息展示区

                 chat-scroll 是"取景框"，负责给上下两条毛玻璃遮罩定位；
                 chat-messages 才是真正滚动的元素（id 没变，app.js 照常工作）。
                 ========================================================= -->
            <div class="chat-scroll">
                <div id="chat-messages" class="chat-messages">
                    <div class="chat-placeholder">请新建或选择一个会话</div>
                </div>
            </div>

            <!-- ③ 输入区（固定） -->
            <div class="chat-input">

                <!-- 图片预览（选了图片才出现，平时是 d-none） -->
                <div id="image-preview" class="image-preview d-none">
                    <img id="image-preview-img" class="image-preview-img" alt="错题图片预览">
                    <div class="image-preview-text">
                        <div id="image-preview-name" class="image-preview-name">错题图片</div>
                        <div id="image-preview-status" class="image-preview-status">准备中...</div>
                    </div>
                    <button id="image-remove" class="image-remove" type="button" title="移除这张图片">
                        ×
                    </button>
                </div>

                <div class="composer">

                    <textarea
                        id="chat-input"
                        rows="1"
                        placeholder="请新建或选择一个会话"
                        disabled
                    ></textarea>

                    <!-- ============ 📷 上传错题图片 ============
                         点它 -> 弹出系统选图框 -> 选中后自动
                         压缩、预览、送后端识别文字、填进上面的输入框 -->
                    <button
                        id="image-btn"
                        class="btn-image"
                        type="button"
                        title="上传错题图片，自动识别文字"
                        disabled
                    >
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.2a1 1 0 0 0 .83-.45l.94-1.4A1 1 0 0 1 9.3 3.7h5.4a1 1 0 0 1 .83.45l.94 1.4a1 1 0 0 0 .83.45h1.2A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5Z"/>
                            <circle cx="12" cy="13" r="3.5"/>
                        </svg>
                    </button>

                    <!-- 真正的文件选择框，被藏起来了，由上面的按钮触发 -->
                    <input
                        id="image-input"
                        type="file"
                        accept="image/jpeg,image/png,image/gif,image/webp"
                        hidden
                    >

                    <button id="send-btn" class="send-btn" type="button" disabled>
                        <span
                            id="send-spinner"
                            class="spinner-border spinner-border-sm d-none"
                            role="status"
                            aria-hidden="true"
                        ></span>

                        <svg class="send-icon" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="m22 2-7 20-4-9-9-4Z"/>
                            <path d="M22 2 11 13"/>
                        </svg>

                        <span id="send-text">发送</span>
                    </button>

                </div>

                <div class="chat-hint">
                    按 <kbd>Ctrl</kbd> + <kbd>Enter</kbd> 也能发送 · AI 不会直接给答案，会一步步引导你
                </div>

            </div>

            <!-- ④ 诊断日志（折叠面板，测试用） -->
            <div id="log-panel" class="collapse log-panel">
                <div class="log-inner">

                    <div class="log-header">
                        <span class="log-title">诊断日志</span>
                        <button type="button" id="clear-log-btn" class="btn-ghost btn-ghost-sm">
                            清空
                        </button>
                    </div>

                    <div id="ai-log" class="ai-log"></div>

                </div>
            </div>

        </section>

    </div>

    <!-- =========================================================
         学习报告弹窗
         ---------------------------------------------------------
         里面的两个图表由 ECharts 画（app.js 里按需加载）。
         注意：ECharts 是从国内 CDN 引入的，国外 CDN 可能打不开。
         ========================================================= -->
    <div id="report-modal" class="modal-mask d-none">
        <div class="modal-box report-box" role="dialog" aria-modal="true">

            <div class="report-header">
                <div>
                    <div class="modal-title report-title">📊 学习报告</div>
                    <div id="report-subtitle" class="report-subtitle">加载中...</div>
                </div>
                <button id="report-close" class="btn-ghost btn-ghost-sm" type="button">
                    关闭
                </button>
            </div>

            <!-- 顶部三个数字 -->
            <div class="report-stats">
                <div class="report-stat">
                    <div id="stat-sessions" class="report-stat-num">0</div>
                    <div class="report-stat-label">会话数</div>
                </div>
                <div class="report-stat">
                    <div id="stat-questions" class="report-stat-num">0</div>
                    <div class="report-stat-label">做题数</div>
                </div>
                <div class="report-stat">
                    <div id="stat-diagnosed" class="report-stat-num">0</div>
                    <div class="report-stat-label">已诊断</div>
                </div>
            </div>

            <!-- 图表区 -->
            <div id="report-body" class="report-body">
                <div class="report-chart-card">
                    <div class="report-chart-title">错因分布</div>
                    <div id="chart-error" class="report-chart"></div>
                </div>

                <div class="report-chart-card">
                    <div class="report-chart-title">知识点错误次数排行</div>
                    <div id="chart-knowledge" class="report-chart"></div>
                </div>
            </div>

            <!-- 没有数据时的提示 -->
            <div id="report-empty" class="report-empty d-none">
                还没有诊断记录，先去聊几道错题吧 🙂
            </div>

        </div>
    </div>

    <!-- =========================================================
         删除确认弹窗
         ---------------------------------------------------------
         平时用 d-none 隐藏。app.js 里的 showConfirm() 会显示它，
         并根据用户点的是"取消"还是"确认删除"返回 true / false。
         ========================================================= -->
    <div id="confirm-modal" class="modal-mask d-none">
        <div class="modal-box" role="dialog" aria-modal="true">

            <div class="modal-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18"/>
                    <path d="M8 6V4h8v2"/>
                    <path d="M19 6l-1 14H6L5 6"/>
                    <path d="M10 11v6M14 11v6"/>
                </svg>
            </div>

            <div id="confirm-title" class="modal-title">确定要删除吗？</div>
            <div id="confirm-text" class="modal-text">删除后无法恢复。</div>

            <div class="modal-actions">
                <button id="confirm-cancel" class="btn-modal btn-modal-ghost" type="button">
                    取消
                </button>
                <button id="confirm-ok" class="btn-modal btn-modal-danger" type="button">
                    确认删除
                </button>
            </div>

        </div>
    </div>

    <!-- Bootstrap 的 JS（折叠面板等组件需要它） -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- 我们自己的脚本 -->
    <script src="js/app.js"></script>
</body>
</html>
